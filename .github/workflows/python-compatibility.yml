name: "Python Compatibility"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 4 * * 6'

permissions:
  contents: read

jobs:
  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        experimental:
          - false
        include:
          - python-version: "3.15"
            experimental: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.experimental }}

      - name: Install package
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e .

      - name: Verify package
        env:
          DARC_USER: nobody
          TOR_PASS: 'null'
        run: |
          python -m compileall -q darc
          python -c 'import darc; print(darc.__version__)'
